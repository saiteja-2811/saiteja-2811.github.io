<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Light background -->
  <rect width="800" height="500" fill="#e8eef3"/>
  
  <!-- Decorative circles in background -->
  <circle cx="120" cy="80" r="30" fill="#90caf9" opacity="0.3"/>
  <circle cx="680" cy="100" r="35" fill="#64b5f6" opacity="0.3"/>
  <circle cx="150" cy="420" r="25" fill="#42a5f5" opacity="0.3"/>
  <circle cx="650" cy="400" r="30" fill="#2196f3" opacity="0.3"/>
  
  <!-- Person 1 (left side) - holding box A -->
  <g transform="translate(200, 320)">
    <!-- Head -->
    <circle cx="0" cy="-80" r="25" fill="#64b5f6"/>
    
    <!-- Body -->
    <path d="M -20,-55 L -20,0 L -10,0 L -10,-30 L 10,-30 L 10,0 L 20,0 L 20,-55 Z" fill="#2196f3"/>
    
    <!-- Arms (left arm extended to hold box) - animated -->
    <path d="M -20,-40 L -60,-20 L -60,-10 L -20,-30 Z" fill="#64b5f6">
      <animate attributeName="d" values="M -20,-40 L -60,-20 L -60,-10 L -20,-30 Z;M -20,-40 L -60,-25 L -60,-15 L -20,-30 Z;M -20,-40 L -60,-20 L -60,-10 L -20,-30 Z;M -20,-40 L -60,-15 L -60,-5 L -20,-30 Z;M -20,-40 L -60,-20 L -60,-10 L -20,-30 Z" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 20,-40 L 80,-30 L 80,-20 L 20,-30 Z" fill="#64b5f6">
      <animate attributeName="d" values="M 20,-40 L 80,-30 L 80,-20 L 20,-30 Z;M 20,-40 L 80,-35 L 80,-25 L 20,-30 Z;M 20,-40 L 80,-30 L 80,-20 L 20,-30 Z;M 20,-40 L 80,-25 L 80,-15 L 20,-30 Z;M 20,-40 L 80,-30 L 80,-20 L 20,-30 Z" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Legs -->
    <rect x="-18" y="0" width="15" height="50" rx="3" fill="#1e88e5"/>
    <rect x="3" y="0" width="15" height="50" rx="3" fill="#1e88e5"/>
    
    <!-- Feet -->
    <ellipse cx="-10" cy="55" rx="12" ry="6" fill="#1565c0"/>
    <ellipse cx="10" cy="55" rx="12" ry="6" fill="#1565c0"/>
  </g>
  
  <!-- Person 2 (right side) - holding box B -->
  <g transform="translate(600, 320)">
    <!-- Head -->
    <circle cx="0" cy="-80" r="25" fill="#64b5f6"/>
    
    <!-- Body -->
    <path d="M -20,-55 L -20,0 L -10,0 L -10,-30 L 10,-30 L 10,0 L 20,0 L 20,-55 Z" fill="#2196f3"/>
    
    <!-- Arms (right arm extended to hold box) - animated -->
    <path d="M -20,-40 L -80,-30 L -80,-20 L -20,-30 Z" fill="#64b5f6">
      <animate attributeName="d" values="M -20,-40 L -80,-30 L -80,-20 L -20,-30 Z;M -20,-40 L -80,-25 L -80,-15 L -20,-30 Z;M -20,-40 L -80,-30 L -80,-20 L -20,-30 Z;M -20,-40 L -80,-35 L -80,-25 L -20,-30 Z;M -20,-40 L -80,-30 L -80,-20 L -20,-30 Z" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 20,-40 L 60,-20 L 60,-10 L 20,-30 Z" fill="#64b5f6">
      <animate attributeName="d" values="M 20,-40 L 60,-20 L 60,-10 L 20,-30 Z;M 20,-40 L 60,-15 L 60,-5 L 20,-30 Z;M 20,-40 L 60,-20 L 60,-10 L 20,-30 Z;M 20,-40 L 60,-25 L 60,-15 L 20,-30 Z;M 20,-40 L 60,-20 L 60,-10 L 20,-30 Z" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Legs -->
    <rect x="-18" y="0" width="15" height="50" rx="3" fill="#1e88e5"/>
    <rect x="3" y="0" width="15" height="50" rx="3" fill="#1e88e5"/>
    
    <!-- Feet -->
    <ellipse cx="-10" cy="55" rx="12" ry="6" fill="#1565c0"/>
    <ellipse cx="10" cy="55" rx="12" ry="6" fill="#1565c0"/>
  </g>
  
  <!-- Box A (left side - pink/coral color changed to light blue) -->
  <g>
    <rect x="280" y="200" width="100" height="100" rx="5" fill="#90caf9" opacity="0.9" stroke="#1976d2" stroke-width="3">
      <!-- Balancing animation - slight up and down motion -->
      <animate attributeName="y" values="200;195;200;205;200" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Letter A -->
    <text x="330" y="265" font-family="Arial" font-size="60" font-weight="bold" fill="#1976d2" text-anchor="middle">
      <animate attributeName="y" values="265;260;265;270;265" dur="4s" repeatCount="indefinite"/>
      A
    </text>
  </g>
  
  <!-- Box B (right side - yellow/orange changed to medium blue) -->
  <g>
    <rect x="420" y="180" width="100" height="100" rx="5" fill="#42a5f5" opacity="0.9" stroke="#1976d2" stroke-width="3">
      <!-- Balancing animation - opposite phase from A -->
      <animate attributeName="y" values="180;185;180;175;180" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Letter B -->
    <text x="470" y="245" font-family="Arial" font-size="60" font-weight="bold" fill="#1976d2" text-anchor="middle">
      <animate attributeName="y" values="245;250;245;240;245" dur="4s" repeatCount="indefinite"/>
      B
    </text>
  </g>
  
  <!-- Balance beam/line connecting the boxes -->
  <line x1="330" y1="250" x2="470" y2="240" stroke="#1976d2" stroke-width="3" opacity="0.5">
    <animate attributeName="y1" values="250;245;250;255;250" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="240;245;240;235;240" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Fulcrum/pivot point in center -->
  <g transform="translate(400, 280)">
    <path d="M -15,0 L 0,-20 L 15,0 Z" fill="#1976d2" opacity="0.7"/>
  </g>
  
  <!-- Small scale/balance indicators -->
  <g opacity="0.4">
    <circle cx="330" cy="160" r="8" fill="#64b5f6">
      <animate attributeName="cy" values="160;155;160;165;160" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="140" r="8" fill="#42a5f5">
      <animate attributeName="cy" values="140;145;140;135;140" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
</svg>
