<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Light background -->
  <rect width="800" height="500" fill="#e8eef3"/>
  
  <!-- Decorative circles in background -->
  <circle cx="150" cy="100" r="30" fill="#90caf9" opacity="0.4"/>
  <circle cx="650" cy="120" r="35" fill="#64b5f6" opacity="0.4"/>
  <circle cx="120" cy="380" r="25" fill="#42a5f5" opacity="0.4"/>
  <circle cx="680" cy="350" r="40" fill="#2196f3" opacity="0.4"/>
  <circle cx="250" cy="80" r="20" fill="#90caf9" opacity="0.3"/>
  <circle cx="550" cy="450" r="30" fill="#64b5f6" opacity="0.3"/>
  
  <!-- Store icon (left side) -->
  <g transform="translate(320, 250)">
    <!-- Store building -->
    <rect x="-60" y="-40" width="120" height="100" rx="5" fill="#2196f3" opacity="0.9"/>
    
    <!-- Store awning -->
    <path d="M -70,-40 L -60,-50 L 60,-50 L 70,-40 Z" fill="#1976d2"/>
    <rect x="-70" y="-50" width="20" height="10" fill="#1565c0"/>
    <rect x="-40" y="-50" width="20" height="10" fill="#1565c0"/>
    <rect x="-10" y="-50" width="20" height="10" fill="#1565c0"/>
    <rect x="20" y="-50" width="20" height="10" fill="#1565c0"/>
    <rect x="50" y="-50" width="20" height="10" fill="#1565c0"/>
    
    <!-- Store window -->
    <rect x="-40" y="-20" width="30" height="30" rx="3" fill="#bbdefb"/>
    <rect x="10" y="-20" width="30" height="30" rx="3" fill="#bbdefb"/>
    
    <!-- Store door -->
    <rect x="-15" y="20" width="30" height="40" rx="3" fill="#1565c0"/>
    <circle cx="5" cy="40" r="2" fill="#90caf9"/>
  </g>
  
  <!-- Three arrows diverging from store -->
  <g opacity="0.6">
    <!-- Top arrow (angled upward) -->
    <path d="M 370 250 L 480 150" stroke="#2196f3" stroke-width="3" fill="none"/>
    <polygon points="480,150 472,155 475,163" fill="#2196f3"/>
    
    <!-- Middle arrow (straight) -->
    <path d="M 370 250 L 480 250" stroke="#2196f3" stroke-width="3" fill="none"/>
    <polygon points="480,250 470,245 470,255" fill="#2196f3"/>
    
    <!-- Bottom arrow (angled downward) -->
    <path d="M 370 250 L 480 350" stroke="#2196f3" stroke-width="3" fill="none"/>
    <polygon points="480,350 475,342 472,350" fill="#2196f3"/>
  </g>
  
  <!-- Row 1: Person icons (top - along upward arrow) - varies 0-4 people -->
  <g transform="translate(500, 150)">
    <!-- Person 1 (leftmost) - appears first, disappears last -->
    <g>
      <circle cx="0" cy="-8" r="8" fill="#2196f3"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#2196f3"/>
      <animate attributeName="opacity" values="0;1;1;1;1;1;1;0" dur="8s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 2 - appears second, disappears third -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="-8" r="8" fill="#1976d2"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#1976d2"/>
      <animate attributeName="opacity" values="0;0;1;1;1;1;0;0" dur="8s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 3 - appears third, disappears second -->
    <g transform="translate(80, 0)">
      <circle cx="0" cy="-8" r="8" fill="#42a5f5"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#42a5f5"/>
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" dur="8s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 4 (rightmost) - appears last, disappears first -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="-8" r="8" fill="#64b5f6"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#64b5f6"/>
      <animate attributeName="opacity" values="0;0;0;0;1;0;0;0" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Row 2: Person icons (middle - along straight arrow) - varies 0-4 people -->
  <g transform="translate(500, 250)">
    <!-- Person 1 (leftmost) - appears first, disappears last -->
    <g>
      <circle cx="0" cy="-8" r="8" fill="#1e88e5"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#1e88e5"/>
      <animate attributeName="opacity" values="0;1;1;1;1;1;0;0" dur="10s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 2 - appears second, disappears third -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="-8" r="8" fill="#2196f3"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#2196f3"/>
      <animate attributeName="opacity" values="0;0;1;1;1;0;0;0" dur="10s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 3 - appears third, disappears second -->
    <g transform="translate(80, 0)">
      <circle cx="0" cy="-8" r="8" fill="#1976d2"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#1976d2"/>
      <animate attributeName="opacity" values="0;0;0;1;0;0;0;0" dur="10s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 4 (rightmost) - appears last, disappears first -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="-8" r="8" fill="#42a5f5"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#42a5f5"/>
      <animate attributeName="opacity" values="0;0;0;0;0;0;0;0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Row 3: Person icons (bottom - along downward arrow) - varies 0-4 people -->
  <g transform="translate(500, 350)">
    <!-- Person 1 (leftmost) - appears first, disappears last -->
    <g>
      <circle cx="0" cy="-8" r="8" fill="#64b5f6"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#64b5f6"/>
      <animate attributeName="opacity" values="0;1;1;1;1;1;1;0" dur="12s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 2 - appears second, disappears third -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="-8" r="8" fill="#1e88e5"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#1e88e5"/>
      <animate attributeName="opacity" values="0;0;1;1;1;1;0;0" dur="12s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 3 - appears third, disappears second -->
    <g transform="translate(80, 0)">
      <circle cx="0" cy="-8" r="8" fill="#2196f3"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#2196f3"/>
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" dur="12s" repeatCount="indefinite"/>
    </g>
    
    <!-- Person 4 (rightmost) - appears last, disappears first -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="-8" r="8" fill="#1976d2"/>
      <path d="M -10,0 L -10,20 L -5,20 L -5,8 L 5,8 L 5,20 L 10,20 L 10,0 Z" fill="#1976d2"/>
      <animate attributeName="opacity" values="0;0;0;0;1;0;0;0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Small gear icons for optimization theme -->
  <g transform="translate(400, 150)" opacity="0.6">
    <circle cx="0" cy="0" r="20" fill="#64b5f6"/>
    <circle cx="0" cy="0" r="12" fill="#e8eef3"/>
    <rect x="-3" y="-25" width="6" height="10" rx="2" fill="#64b5f6"/>
    <rect x="-3" y="15" width="6" height="10" rx="2" fill="#64b5f6"/>
    <rect x="-25" y="-3" width="10" height="6" rx="2" fill="#64b5f6"/>
    <rect x="15" y="-3" width="10" height="6" rx="2" fill="#64b5f6"/>
  </g>
  
  <g transform="translate(400, 350)" opacity="0.6">
    <circle cx="0" cy="0" r="15" fill="#42a5f5"/>
    <circle cx="0" cy="0" r="9" fill="#e8eef3"/>
    <rect x="-2" y="-18" width="4" height="8" rx="1" fill="#42a5f5"/>
    <rect x="-2" y="10" width="4" height="8" rx="1" fill="#42a5f5"/>
    <rect x="-18" y="-2" width="8" height="4" rx="1" fill="#42a5f5"/>
    <rect x="10" y="-2" width="8" height="4" rx="1" fill="#42a5f5"/>
  </g>
  
</svg>
